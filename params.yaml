
# Elliptic Sentinel - Project Configuration

project:
  name: elliptic_sentinel
  random_seed: 42

# Dataset configuration
data:
  raw_dir: data/raw/elliptic
  interim_dir: data/interim/elliptic
  processed_dir: data/processed/elliptic

  features_file: elliptic_txs_features.csv
  edges_file: elliptic_txs_edgelist.csv
  classes_file: elliptic_txs_classes.csv

  num_local_features: 93
  num_aggregated_features: 72
  num_features: 165

  min_time_step: 1
  max_time_step: 49

# Temporal data split
split:
  train:
    start_time_step: 1
    end_time_step: 29

  validation:
    start_time_step: 30
    end_time_step: 34

  test:
    start_time_step: 35
    end_time_step: 49

# Feature preprocessing
preprocessing:
  scaler: standard
  fit_on: train_only
  preserve_unlabeled: true

# General training configuration
training:
  random_seed: 42
  device: cpu
  batch_size: 256
  num_workers: 0

# XGBoost baseline
tabular:
  model: xgboost

  xgboost:
    objective: binary:logistic
    eval_metric: aucpr
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

# Directed GraphSAGE configuration
gnn:
  model: directed_graphsage

  num_layers: 2
  hidden_channels: 64
  dropout: 0.3
  aggregation: mean

  # Degree features
  use_degree_features: true
  degree_features:
    - log_in_degree
    - log_out_degree

  # Learning-rate pilot
  learning_rate_candidates:
    - 0.001
    - 0.005
    - 0.01

  optimizer: adam
  loss: weighted_bce

  weight_decay: 0.0001
  max_epochs: 500
  early_stopping_patience: 50

  device: cpu
  random_state: 42

# Evaluation configuration
evaluation:
  primary_metric: average_precision
  threshold_selection: validation_only
  alert_fraction: 0.01

  report_metrics:
    - average_precision
    - roc_auc
    - precision
    - recall
    - f1
    - confusion_matrix

# Monitoring configuration
monitoring:
  mode: simulated_chronological_replay

  replay:
    start_time_step: 35
    end_time_step: 49

  show_simulated_replay_banner: true
