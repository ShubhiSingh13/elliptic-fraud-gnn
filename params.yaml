project:
  name: elliptic-sentinel
  random_seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts

  local_feature_count: 93
  aggregated_feature_count: 72
  total_feature_count: 165

  first_step: 1
  last_step: 49

split:
  train:
    start_step: 1
    end_step: 29
  validation:
    start_step: 30
    end_step: 34
  test:
    start_step: 35
    end_step: 49

preprocessing:
  scaler: standard
  fit_scaler_on: train_only
  preserve_unlabeled_nodes: true

training:
  random_seed: 42
  device: cpu
  batch_size: 256
  num_workers: 0

tabular_model:
  xgboost:
    objective: binary:logistic
    eval_metric: aucpr
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

gnn:
  model: gcn
  num_layers: 2
  hidden_channels: 64
  dropout: 0.3
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  early_stopping_patience: 10

evaluation:
  primary_metric: average_precision
  threshold_selection: validation_only
  report_metrics:
    - average_precision
    - roc_auc
    - precision
    - recall
    - f1
    - confusion_matrix

monitoring:
  mode: simulated_chronological_replay
  first_replay_step: 35
  last_replay_step: 49
  show_simulated_replay_banner: true